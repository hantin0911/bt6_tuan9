name: Java CI with Maven Caching for Bai06

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Nâng lên v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # Nâng lên v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # YÊU CẦU BÀI 6: Cache giúp tăng tốc build các lần sau
          cache: 'maven'

      - name: Build and Verify with Maven
        # ĐÃ SỬA: Bỏ --file Bai06/pom.xml nếu tệp nằm ở gốc
        # Lệnh verify sẽ tự động chạy Checkstyle ở phase validate
        run: mvn -B clean verify

      - name: Upload Checkstyle Report
        if: failure() # Chỉ upload nếu bị lỗi style để bạn xem và sửa
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml